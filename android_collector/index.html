<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LSM — Recolector</title>
  <style>
    :root {
      --bg:      #0D0D0F;
      --bg2:     #13131F;
      --border:  #252545;
      --cyan:    #00F5D4;
      --orange:  #F5A623;
      --red:     #FF6060;
      --text:    #E0E0F0;
      --muted:   #7080A0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

    /* ── Layout: camera top, controls scrollable below ── */
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Camera ── */
    #cam-wrap {
      position: relative;
      width: 100%;
      background: #000;
      flex-shrink: 0;
    }
    #video  { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
              pointer-events: none; transform: scaleX(-1); }

    #countdown-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 96px; font-weight: 900;
      color: var(--cyan); text-shadow: 0 0 40px var(--cyan);
      background: rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.15s; pointer-events: none;
    }
    #no-hand-pill {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: var(--orange);
      font-size: 12px; padding: 4px 14px; border-radius: 20px;
      white-space: nowrap; opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    #cam-btn-flip {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.55); border: 1px solid var(--border);
      border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: var(--text);
    }
    #loading-overlay {
      position: absolute; inset: 0; background: rgba(13,13,15,0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--cyan); font-size: 14px; font-weight: 600;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--cyan); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Controls panel ── */
    #controls { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

    .panel { padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }

    /* Sign info row */
    #sign-row { display: flex; align-items: center; gap: 12px; }
    #lbl-letter {
      font-size: 56px; font-weight: 900; color: var(--cyan);
      min-width: 64px; line-height: 1; text-align: center; flex-shrink: 0;
    }
    #sign-meta { flex: 1; min-width: 0; }
    #lbl-sign-name  { font-size: 17px; font-weight: 700; color: var(--text); }
    #lbl-desc       { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    #lbl-status     { font-size: 13px; color: var(--orange); font-weight: 600; margin-top: 4px; }

    /* Progress */
    .prog-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .prog-label { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    progress {
      flex: 1; height: 10px; border-radius: 5px; border: none;
      -webkit-appearance: none; appearance: none;
    }
    progress::-webkit-progress-bar   { background: #0A0A15; border-radius: 5px; }
    progress::-webkit-progress-value { background: var(--cyan); border-radius: 5px; transition: width 0.12s; }
    #interval-bar::-webkit-progress-value { background: var(--orange); }
    progress::-moz-progress-bar { background: var(--cyan); border-radius: 5px; }
    #interval-bar::-moz-progress-bar { background: var(--orange); }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
    button { border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.12s; -webkit-appearance: none; }
    #btn-record {
      flex: 2; padding: 14px 8px;
      background: rgba(0,245,212,0.10); border: 1.5px solid rgba(0,245,212,0.45);
      color: var(--cyan);
    }
    #btn-record:active { background: rgba(0,245,212,0.28); }
    #btn-record:disabled { opacity: 0.35; }
    #btn-delete {
      flex: 1; padding: 14px 8px;
      background: rgba(255,96,96,0.10); border: 1.5px solid rgba(255,96,96,0.40);
      color: var(--red);
    }
    #btn-delete:active { background: rgba(255,96,96,0.28); }
    #btn-skip {
      flex: 1; padding: 14px 8px;
      background: #1A1A2E; border: 1.5px solid #333355;
      color: var(--muted);
    }
    #btn-skip:active { background: #252545; }

    /* Sign grid */
    #grid-section { flex: 1; padding: 10px 14px; overflow-y: auto; }
    #grid-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .sign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
    .chip {
      background: #0A0A15; border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 4px; text-align: center; cursor: pointer; transition: border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active { background: #12121F; }
    .chip .cl { font-size: 15px; font-weight: 700; color: var(--muted); }
    .chip .cc { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .chip.done  { border-color: var(--cyan); }
    .chip.done .cl, .chip.done .cc { color: var(--cyan); }
    .chip.active { border-color: var(--orange); background: rgba(245,166,35,0.08); }
    .chip.active .cl { color: var(--orange); }

    /* Export */
    #export-section { padding: 8px 14px 16px; background: var(--bg); border-top: 1px solid var(--border); }
    #btn-export {
      width: 100%; padding: 13px;
      background: #14142A; border: 1.5px solid #2A2A48; border-radius: 8px;
      color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #btn-export:active { background: #1E1E38; }
    #export-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; }
  </style>
</head>
<body>

<!-- ── Camera ── -->
<div id="cam-wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="countdown-overlay">3</div>
  <div id="no-hand-pill">Sin mano detectada</div>
  <div id="cam-btn-flip" title="Cambiar camara">&#x1F504;</div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span id="loading-msg">Cargando MediaPipe...</span>
  </div>
</div>

<!-- ── Controls ── -->
<div id="controls">

  <div class="panel">
    <div id="sign-row">
      <div id="lbl-letter">A</div>
      <div id="sign-meta">
        <div id="lbl-sign-name">A</div>
        <div id="lbl-desc">—</div>
        <div id="lbl-status">Iniciando...</div>
      </div>
    </div>
    <div class="prog-row">
      <span class="prog-label" id="prog-text">0 / 50</span>
      <progress id="main-bar" max="50" value="0"></progress>
    </div>
    <div class="prog-row">
      <span class="prog-label">Intervalo:</span>
      <progress id="interval-bar" max="100" value="0"></progress>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-record">GRABAR</button>
    <button id="btn-delete">Borrar</button>
    <button id="btn-skip">Sig. &#x2192;</button>
  </div>

  <div id="grid-section">
    <div id="grid-title">Todas las senales</div>
    <div class="sign-grid" id="sign-grid"></div>
  </div>

  <div id="export-section">
    <button id="btn-export">&#x2B07; Exportar datos (JSON)</button>
    <div id="export-hint">Comparte el archivo por WhatsApp o correo al desarrollador</div>
  </div>

</div><!-- #controls -->

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
//  LSM Android Collector
//  Requires Chrome for Android (camera + WASM).
//  Stores data in localStorage; exports as JSON for import with
//  tools/import_android_data.py on the developer's computer.
// ─────────────────────────────────────────────────────────────────────────────

import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── Vocabulary (must match config.py) ────────────────────────────────────────
const SIGNS = {
  "A":       "Puno cerrado, pulgar al lado",
  "B":       "Dedos rectos y juntos, pulgar doblado hacia la palma",
  "C":       "Mano curvada formando una C",
  "D":       "Indice recto hacia arriba, demas doblados, pulgar toca el medio",
  "E":       "Dedos doblados hacia la palma, pulgar bajo los dedos",
  "F":       "Indice y pulgar se tocan, otros tres dedos extendidos",
  "G":       "Indice apunta al lado, pulgar paralelo",
  "H":       "Indice y medio extendidos al lado, juntos",
  "I":       "Menique extendido, resto cerrado en puno",
  "J":       "Menique extendido, traza una J en el aire",
  "K":       "Indice arriba, medio diagonal, pulgar entre ellos",
  "L":       "Indice apunta arriba, pulgar al lado (forma L)",
  "M":       "Tres dedos doblados sobre el pulgar",
  "N":       "Dos dedos doblados sobre el pulgar",
  "O":       "Todos los dedos forman una O con el pulgar",
  "P":       "Como K pero apuntando hacia abajo",
  "Q":       "Indice y pulgar apuntan hacia abajo",
  "R":       "Indice y medio cruzados, apuntan arriba",
  "S":       "Puno cerrado, pulgar sobre los dedos",
  "T":       "Puno cerrado, pulgar entre indice y medio",
  "U":       "Indice y medio extendidos juntos hacia arriba",
  "V":       "Indice y medio en V abierta",
  "W":       "Indice, medio y anular extendidos en W",
  "X":       "Indice doblado como un gancho",
  "Y":       "Pulgar y menique extendidos, otros doblados",
  "Z":       "Indice extendido, traza una Z en el aire",
  "ESPACIO": "Mano abierta, palma al frente (pausa entre palabras)",
  "BORRAR":  "Puno cerrado (elimina la ultima letra)",
};
const LABELS           = Object.keys(SIGNS);
const SAMPLES_PER_SIGN = 50;
const INTERVAL_MS      = 400;
const STORAGE_KEY      = "lsm_collector_v1";

// Hand skeleton connections (21 landmarks)
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17],
];

// ── Persistent store ──────────────────────────────────────────────────────────
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "{}"); }
  catch { return {}; }
}
function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
let store = loadStore();
function sampleCount(label) { return (store[label] ?? []).length; }

// ── App state ─────────────────────────────────────────────────────────────────
let signIndex    = 0;
let recording    = false;
let countdown    = 0;
let buffer       = [];
let lastSampleTs = 0;
let facingMode   = "user";   // "user" = front cam (selfie), "environment" = rear
let handLandmarker = null;
let currentStream  = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const video           = document.getElementById("video");
const canvas          = document.getElementById("canvas");
const ctx             = canvas.getContext("2d");
const loadingOverlay  = document.getElementById("loading-overlay");
const loadingMsg      = document.getElementById("loading-msg");
const countdownEl     = document.getElementById("countdown-overlay");
const noHandPill      = document.getElementById("no-hand-pill");
const camWrap         = document.getElementById("cam-wrap");
const lblLetter       = document.getElementById("lbl-letter");
const lblName         = document.getElementById("lbl-sign-name");
const lblDesc         = document.getElementById("lbl-desc");
const lblStatus       = document.getElementById("lbl-status");
const mainBar         = document.getElementById("main-bar");
const intervalBar     = document.getElementById("interval-bar");
const progText        = document.getElementById("prog-text");
const btnRecord       = document.getElementById("btn-record");
const btnDelete       = document.getElementById("btn-delete");
const btnSkip         = document.getElementById("btn-skip");
const signGrid        = document.getElementById("sign-grid");
const btnExport       = document.getElementById("btn-export");
const btnFlip         = document.getElementById("cam-btn-flip");

// ── Camera ────────────────────────────────────────────────────────────────────
async function startCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    video.srcObject = currentStream;
    await new Promise(resolve => { video.onloadedmetadata = resolve; });
    // Sync canvas size to video
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    // Match cam-wrap height to keep aspect ratio
    const aspect = video.videoHeight / video.videoWidth;
    camWrap.style.height = `${camWrap.offsetWidth * aspect}px`;
  } catch (err) {
    loadingMsg.textContent = "Error camara: " + err.message;
    throw err;
  }
}

window.addEventListener("resize", () => {
  if (video.videoWidth) {
    const aspect = video.videoHeight / video.videoWidth;
    camWrap.style.height = `${camWrap.offsetWidth * aspect}px`;
  }
});

btnFlip.addEventListener("click", async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  // Flip the mirror transform: front cam needs mirror, rear cam doesn't
  const mirror = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
  video.style.transform  = mirror;
  canvas.style.transform = mirror;
  await startCamera();
});

// ── MediaPipe init ────────────────────────────────────────────────────────────
async function initMediaPipe() {
  loadingMsg.textContent = "Descargando modelo...";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  loadingMsg.textContent = "Cargando detector...";
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
  });
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawHand(landmarks) {
  const w = canvas.width, h = canvas.height;
  ctx.strokeStyle = "#00F5D4";
  ctx.lineWidth   = 2;
  for (const [a, b] of CONNECTIONS) {
    ctx.beginPath();
    ctx.moveTo(landmarks[a].x * w, landmarks[a].y * h);
    ctx.lineTo(landmarks[b].x * w, landmarks[b].y * h);
    ctx.stroke();
  }
  for (const lm of landmarks) {
    ctx.beginPath();
    ctx.arc(lm.x * w, lm.y * h, 4, 0, 2 * Math.PI);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
  }
}

// ── Main detect loop ──────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  if (!handLandmarker || video.readyState < 2 || video.paused) return;

  const tsMs   = performance.now();
  const result = handLandmarker.detectForVideo(video, tsMs);
  const hasHand = result.landmarks?.length > 0;

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (hasHand) drawHand(result.landmarks[0]);

  // No-hand pill
  noHandPill.style.opacity = (recording && !hasHand) ? "1" : "0";

  // Interval bar
  if (recording && hasHand) {
    const elapsed = tsMs - lastSampleTs;
    const pct = Math.min(100, Math.round(100 * elapsed / INTERVAL_MS));
    intervalBar.value = pct;
  } else {
    intervalBar.value = 0;
  }

  if (!recording || !hasHand) return;

  // Throttle captures
  const elapsed = tsMs - lastSampleTs;
  if (elapsed < INTERVAL_MS) return;

  // ── Capture ─────────────────────────────────────────────────────────────────
  lastSampleTs = tsMs;
  const raw = result.landmarks[0].map(lm => [lm.x, lm.y, lm.z]);
  buffer.push(raw);

  const label     = LABELS[signIndex];
  const existing  = sampleCount(label);
  const collected = existing + buffer.length;
  const need      = SAMPLES_PER_SIGN - existing;

  mainBar.value = Math.min(collected, SAMPLES_PER_SIGN);
  progText.textContent = `${Math.min(collected, SAMPLES_PER_SIGN)} / ${SAMPLES_PER_SIGN}`;
  lblStatus.textContent =
    `Capturada #${buffer.length} — faltan ${Math.max(0, SAMPLES_PER_SIGN - collected)} — mueve la mano!`;

  if (buffer.length >= need) saveSamples(label);
}

// ── Recording control ─────────────────────────────────────────────────────────
function startRecording() {
  if (recording || signIndex >= LABELS.length) return;
  buffer       = [];
  countdown    = 3;
  btnRecord.disabled = true;
  tickCountdown();
}

function tickCountdown() {
  if (countdown > 0) {
    countdownEl.textContent  = countdown;
    countdownEl.style.opacity = "1";
    lblStatus.textContent    = `Preparate... ${countdown}`;
    countdown--;
    setTimeout(tickCountdown, 1000);
  } else {
    countdownEl.style.opacity = "0";
    lblStatus.textContent    = "GRABANDO — mueve la mano lentamente";
    recording    = true;
    lastSampleTs = performance.now();
  }
}

function saveSamples(label) {
  recording = false;
  intervalBar.value = 0;

  if (!store[label]) store[label] = [];
  store[label].push(...buffer);
  store[label] = store[label].slice(0, SAMPLES_PER_SIGN);
  saveStore();
  buffer = [];

  lblStatus.textContent = `Guardadas las muestras de '${label}' ✓`;
  updateGrid();

  setTimeout(() => { signIndex++; showCurrentSign(); }, 900);
}

// ── Delete & skip ─────────────────────────────────────────────────────────────
function deleteCurrent() {
  recording = false;
  buffer    = [];
  const label = LABELS[signIndex];
  const had   = sampleCount(label);
  if (store[label]) { delete store[label]; saveStore(); }

  mainBar.value        = 0;
  progText.textContent = `0 / ${SAMPLES_PER_SIGN}`;
  intervalBar.value    = 0;
  btnRecord.disabled   = false;
  lblStatus.textContent =
    had > 0 ? `Borradas ${had} muestras de '${label}' — listo para repetir`
            : `Sin muestras para borrar`;
  updateGrid();
}

function skipSign() {
  recording = false;
  buffer    = [];
  signIndex++;
  showCurrentSign();
}

// ── Sign UI ───────────────────────────────────────────────────────────────────
function showCurrentSign() {
  if (signIndex >= LABELS.length) {
    lblLetter.textContent = "✓";
    lblName.textContent   = "Completado";
    lblDesc.textContent   = "Todas las senales recolectadas";
    lblStatus.textContent = "Exporta los datos con el boton de abajo";
    btnRecord.disabled    = true;
    updateGrid();
    return;
  }
  const label = LABELS[signIndex];
  lblLetter.textContent = label.length === 1 ? label : label.slice(0, 2);
  lblName.textContent   = label;
  lblDesc.textContent   = SIGNS[label];
  const count           = sampleCount(label);
  mainBar.max           = SAMPLES_PER_SIGN;
  mainBar.value         = count;
  progText.textContent  = `${count} / ${SAMPLES_PER_SIGN}`;
  lblStatus.textContent = "Toca GRABAR para iniciar";
  btnRecord.disabled    = false;
  updateGrid();
  // Scroll grid chip into view
  document.getElementById(`chip-${label}`)?.scrollIntoView({ block: "nearest" });
}

// ── Sign grid ─────────────────────────────────────────────────────────────────
function buildGrid() {
  signGrid.innerHTML = "";
  LABELS.forEach((label, i) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.id        = `chip-${label}`;
    chip.innerHTML =
      `<div class="cl">${label.length === 1 ? label : label.slice(0,2)}</div>` +
      `<div class="cc" id="cc-${label}">0/${SAMPLES_PER_SIGN}</div>`;
    chip.addEventListener("click", () => {
      recording = false; buffer = [];
      signIndex = i;
      showCurrentSign();
    });
    signGrid.appendChild(chip);
  });
}

function updateGrid() {
  LABELS.forEach((label, i) => {
    const chip = document.getElementById(`chip-${label}`);
    const cc   = document.getElementById(`cc-${label}`);
    if (!chip) return;
    const count = sampleCount(label);
    chip.className =
      "chip" +
      (count >= SAMPLES_PER_SIGN ? " done"   : "") +
      (i === signIndex            ? " active" : "");
    cc.textContent = count >= SAMPLES_PER_SIGN ? "OK" : `${count}/${SAMPLES_PER_SIGN}`;
  });
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportData() {
  const total = LABELS.reduce((n, l) => n + sampleCount(l), 0);
  if (total === 0) { alert("No hay datos para exportar."); return; }

  const payload = {
    version:         1,
    samples_per_sign: SAMPLES_PER_SIGN,
    exported_at:     new Date().toISOString(),
    signs:           store,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `lsm_data_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Wire buttons ──────────────────────────────────────────────────────────────
btnRecord.addEventListener("click", startRecording);
btnDelete.addEventListener("click", deleteCurrent);
btnSkip.addEventListener("click", skipSign);
btnExport.addEventListener("click", exportData);

// Tap camera to start (convenience)
camWrap.addEventListener("click", e => {
  if (e.target === btnFlip) return;
  if (!recording && signIndex < LABELS.length) startRecording();
});

// ── Startup ───────────────────────────────────────────────────────────────────
buildGrid();
showCurrentSign();

try {
  await startCamera();
  await initMediaPipe();
  loadingOverlay.style.display = "none";
  loop();
} catch (err) {
  loadingMsg.textContent = "Error: " + err.message;
}
</script>
</body>
</html>
